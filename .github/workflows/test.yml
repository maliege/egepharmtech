name: Build and test

# Her dal ve pull request için derleme + test. Yayın yalnız deploy.yml ile main'e push'ta yapılır;
# bu iş akışı sunucuya hiçbir şey göndermez. Belge değişiklikleri test tetiklemez.
on:
  pull_request:
  push:
    branches-ignore: [ main ]
    paths-ignore: [ 'docs/**', '**.md', 'paper/**', 'CITATION.cff', '.zenodo.json' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PTCalc.sln

      - name: Build (warnings are errors)
        run: dotnet build PTCalc.sln -c Release --no-restore --nologo -warnaserror

      - name: Test
        run: dotnet test PTCalc.Core.Tests/PTCalc.Core.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
