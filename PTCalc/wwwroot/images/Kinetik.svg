<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="kinBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#kinBg)"/>

  <!-- axes -->
  <line x1="56" y1="30" x2="56" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="56" y1="196" x2="356" y2="196" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- grid ticks -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="56" y1="155" x2="356" y2="155"/>
    <line x1="56" y1="113" x2="356" y2="113"/>
    <line x1="56" y1="71" x2="356" y2="71"/>
  </g>

  <!-- decaying reactant curve C(t) = C0 * e^-kt -->
  <path d="M 66 46 C 130 60, 160 130, 200 155 C 240 175, 290 188, 346 192"
        fill="none" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>

  <!-- forming product curve -->
  <path d="M 66 190 C 120 178, 170 110, 220 78 C 270 52, 300 42, 346 36"
        fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- legend -->
  <circle cx="240" cy="224" r="5" fill="#0d9488"/>
  <text x="252" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">C(t)</text>
  <circle cx="300" cy="224" r="5" fill="#f59e0b"/>
  <text x="312" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">P(t)</text>

  <text x="56" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">C</text>
  <text x="352" y="213" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">t</text>
</svg>
