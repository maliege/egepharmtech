  <g fill="#0f766e">
    <circle cx="110" cy="150" r="4.5"/>
    <circle cx="190" cy="70" r="4.5"/>
    <circle cx="270" cy="44" r="4.5"/>
  </g>
  <g fill="#dc2626">
    <circle cx="116" cy="168" r="4.5"/>
    <circle cx="206" cy="96" r="4.5"/>
    <circle cx="286" cy="54" r="4.5"/>
  </g>

  <!-- legend -->
  <line x1="210" y1="224" x2="228" y2="224" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
  <text x="233" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Referans</text>
  <line x1="300" y1="224" x2="318" y2="224" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="323" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Test</text>

  <text x="56" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">%</text>
  <text x="352" y="213" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">t</text>
