    <line x1="56" y1="113" x2="356" y2="113"/>
    <line x1="56" y1="71" x2="356" y2="71"/>
  </g>

  <!-- reference dissolution curve -->
  <path d="M 66 188 C 110 150, 140 96, 190 70 C 240 48, 300 40, 346 38"
